<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LinkTV · 界面回归页</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <script>window.__LINKTV_MODE__ = "demo"; window.__LINKTV_FIT__ = "cover";</script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070d; }
    /* 模拟直播画面（仅本地回归用；真机由央视频官方页面提供） */
    #fake { position: fixed; inset: 0;
      background: radial-gradient(1200px 700px at 50% 40%, #1b2a5e 0%, #0a1130 55%, #05070d 100%); }
    #demo-tip { position: fixed; left: 16px; bottom: 12px; z-index: 9; font-size: 12px;
      color: rgba(255,255,255,.28); font-family: monospace; }
  </style>
</head>
<body>
  <div id="fake"></div>
  <div id="demo-tip">DEMO · 界面回归页，无真实播放</div>

  <!-- 与真机完全同一套频道表 + 注入层（file:// 自动进入 demo 模式） -->
  <script src="js/channels.js"></script>
  <script src="js/inject.js"></script>
</body>
</html>
