<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LinkTV</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- hls.js：用于在非原生支持 HLS 的浏览器里播放 .m3u8。安卓 WebView 原生支持，会自动跳过。 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 顶部：标题 + 分类标签 + 搜索 -->
    <header id="topbar">
      <div class="brand">📺 Link<span class="ver">TV</span></div>
      <nav id="tabs" class="tabs"></nav>
      <div class="top-actions">
        <button id="btn-import" class="btn">导入M3U</button>
        <button id="btn-fav" class="btn">收藏夹</button>
        <input id="search" class="search" type="text" placeholder="搜索频道…" />
      </div>
    </header>

    <!-- 主体：左频道列表 + 右播放器 -->
    <main id="main">
      <aside id="sidebar">
        <ul id="channel-list" class="channel-list"></ul>
      </aside>

      <section id="stage">
        <video id="player" playsinline></video>
        <div id="overlay" class="overlay">
          <div class="now-playing">
            <div id="np-name" class="np-name">未选择频道</div>
            <div id="np-status" class="np-status">请选择左侧频道开始播放</div>
          </div>
        </div>
        <div id="controls" class="controls">
          <button id="btn-playpause" class="ctrl">⏯ 播放/暂停</button>
          <button id="btn-full" class="ctrl">⛶ 全屏</button>
          <button id="btn-fav-toggle" class="ctrl">☆ 收藏</button>
          <span id="ctrl-hint" class="hint">方向键选择 · 确定播放 · 菜单键导入</span>
        </div>
      </section>
    </main>
  </div>

  <!-- 导入 M3U 弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3>导入播放列表 (M3U)</h3>
      <p class="tip">粘贴一个 .m3u / .m3u8 文本或直链，将合并进频道列表。</p>
      <textarea id="m3u-input" placeholder="例如：&#10;#EXTM3U&#10;#EXTINF:-1 tvg-name=&quot;测试&quot;,测试台&#10;https://example.com/test.m3u8"></textarea>
      <div class="modal-actions">
        <button id="m3u-apply" class="btn primary">导入</button>
        <button id="m3u-remote" class="btn">拉取远程URL</button>
        <button id="m3u-close" class="btn">关闭</button>
      </div>
      <div id="m3u-msg" class="m3u-msg"></div>
    </div>
  </div>

  <script src="js/channels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
