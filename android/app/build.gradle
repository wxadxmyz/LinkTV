plugins {
    id 'com.android.application'
}

android {
    namespace 'com.linktv'
    compileSdk 34

    defaultConfig {
        applicationId "com.linktv"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 不强制要求 leanback / 触屏，普通手机也能装
    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    // 本应用为 WebView 外壳，无需额外依赖
}
