plugins {
    id 'com.android.application'
}

android {
    namespace 'com.linktv'
    compileSdk 34

    defaultConfig {
        applicationId "com.linktv"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "2.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

// v2.0.0：架构重写 —— 弃用 WebView 打开官网网页，改为原生播放器直连直播流。
// 依赖全部来自 Google Maven / Maven Central（settings.gradle 已配置）。
def media3 = "1.3.1"
dependencies {
    implementation "androidx.media3:media3-exoplayer:${media3}"         // 播放内核
    implementation "androidx.media3:media3-exoplayer-hls:${media3}"     // m3u8 / HLS
    implementation "androidx.media3:media3-datasource:${media3}"        // 自定义 UA / 跨协议重定向
    // 画面用原生 TextureView 自绘（不引 media3-ui，避免主题兼容依赖）
}
