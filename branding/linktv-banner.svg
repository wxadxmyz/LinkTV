<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2547"/>
      <stop offset="0.6" stop-color="#0d1428"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#38e1d0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- 左侧：链环 + 播放三角 标志 -->
  <g transform="translate(70,150) scale(0.82)">
    <g transform="rotate(-42 256 256)">
      <rect x="56"  y="180" width="236" height="152" rx="76" fill="none" stroke="url(#ringA)" stroke-width="40"/>
      <rect x="220" y="180" width="236" height="152" rx="76" fill="none" stroke="#0c1120" stroke-width="56"/>
      <rect x="220" y="180" width="236" height="152" rx="76" fill="none" stroke="url(#ringB)" stroke-width="40"/>
    </g>
    <path d="M234 206 L234 306 L316 256 Z" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
  </g>

  <!-- 右侧：品牌字 -->
  <text x="620" y="370" font-family="DejaVu Sans, Liberation Sans, sans-serif"
        font-size="150" font-weight="bold" fill="#eef2fb" letter-spacing="2">Link<tspan fill="#ff3b41">TV</tspan></text>
  <text x="626" y="440" font-family="DejaVu Sans, Liberation Sans, sans-serif"
        font-size="29" fill="#8b97b3" letter-spacing="3">LIVE TV  ·  CCTV  ·  ALL CHANNELS</text>
  <rect x="626" y="480" width="120" height="6" rx="3" fill="#ff3b41"/>
</svg>
