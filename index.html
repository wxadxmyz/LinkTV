<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LinkTV</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- hls.js 本地内置：APK 完全离线也能播 m3u8；安卓 WebView 原生 HLS 会自动跳过 -->
  <script src="js/hls.min.js"></script>
</head>
<body>
  <!-- ===================== 全屏播放层 ===================== -->
  <div id="app">
    <div id="stage">
      <video id="player" playsinline autoplay></video>

      <!-- 频道准备画面：无可用直链时显示，界面不出现「源」字样 -->
      <div id="idle" class="idle hidden">
        <div class="idle-logo"><span class="idle-play">▶</span></div>
        <div id="idle-name" class="idle-name">LinkTV</div>
        <div class="idle-sub">正在准备频道</div>
        <div class="idle-dots"><i></i><i></i><i></i></div>
      </div>

      <!-- OSD 信息层：3 秒自动隐藏，按任意键重新亮起 -->
      <div id="osd" class="osd">
        <div class="osd-top">
          <div class="osd-tl">
            <div class="osd-brand">Link<span>TV</span></div>
            <div id="osd-ch" class="osd-ch">CCTV-1 综合</div>
            <div id="osd-cat" class="osd-cat">央视 · 01 / 20</div>
          </div>
          <div class="osd-tr">
            <div id="osd-res" class="osd-res">HD</div>
            <div id="osd-clock" class="osd-clock">--:--</div>
          </div>
        </div>

        <div class="osd-bottom">
          <div class="osd-progrow">
            <span class="live"><i></i>LIVE</span>
            <span id="osd-prog" class="osd-prog">正在直播 · CCTV-1 综合</span>
            <span id="osd-ptime" class="osd-ptime">--:-- / --:--</span>
          </div>
          <div class="osd-bar"><div id="osd-barfill" class="osd-barfill"></div></div>
          <div class="osd-hint">▲▼ 换台　◀▶ 换分类　确定 选台　菜单 收藏</div>
        </div>
      </div>

      <!-- 切台/收藏的短暂提示 -->
      <div id="toast" class="toast hidden"></div>
    </div>

    <!-- ===================== 选台面板（确定键呼出） ===================== -->
    <div id="panel" class="panel hidden">
      <nav id="cats" class="cats"></nav>
      <div class="plist-wrap">
        <div class="plist-head">
          <div id="plist-title" class="plist-title">央视</div>
          <div id="plist-count" class="plist-count"></div>
        </div>
        <ul id="plist" class="plist"></ul>
        <div class="panel-foot">▲▼ 选频道　◀▶ 换分类　确定 播放　菜单 收藏　返回 收起</div>
      </div>
    </div>
  </div>

  <script src="js/channels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
