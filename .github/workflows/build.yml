name: Build LinkTV APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          echo "构建产物: $APK"
          cp "$APK" dist/LinkTV-debug.apk
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkTV-debug-apk
          path: dist/LinkTV-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=dist/LinkTV-debug.apk
          NOTE="自动构建于 $(date -u +'%Y-%m-%d %H:%M UTC')，commit ${GITHUB_SHA:0:7}。debug 签名，可直接安装到电视 / 盒子 / 手机。"
          if gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload latest "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LinkTV 最新构建" \
              --notes "$NOTE" \
              --prerelease
          fi
