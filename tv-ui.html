<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LinkTV · UI 预览</title>
<link rel="icon" type="image/png" href="favicon.png" />
<style>
  :root{
    --bg:#070a12; --bg2:#0e1320; --card:#161d2e; --card2:#1d2740;
    --line:rgba(255,255,255,.08); --txt:#eef2fb; --dim:#8b97b3;
    --acc:#ff3b41; --acc2:#3b82f6; --gold:#ffd24d; --ok:#22d3a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 70% -10%,#16203a 0%,var(--bg) 60%);
    color:var(--txt); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden; letter-spacing:.3px; touch-action:none;
  }
  /* 始终横屏：竖屏时整体旋转 90°，转动手机即为横版电视界面 */
  .screen{display:flex;flex-direction:column;width:100vw;height:100vh;padding:28px 34px 18px}
  @media screen and (orientation:portrait){
    .screen{
      width:100vh; height:100vw;
      position:absolute; top:0; left:100vw;
      transform:rotate(90deg); transform-origin:0 0;
    }
  }

  /* 顶部状态栏 */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800}
  .brand .dot{width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
  .brand small{font-size:13px;color:var(--dim);font-weight:500;margin-left:6px}
  .status{display:flex;align-items:center;gap:18px;color:var(--dim);font-size:15px}
  .status .live{display:flex;align-items:center;gap:7px;color:var(--ok);font-weight:600}
  .status .live i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .status .clock{font-variant-numeric:tabular-nums;font-size:17px;color:var(--txt)}
  .status .sig{display:flex;gap:3px;align-items:flex-end}
  .status .sig span{width:4px;background:var(--txt);border-radius:2px}
  .status .sig span:nth-child(1){height:7px;opacity:.4}
  .status .sig span:nth-child(2){height:11px;opacity:.6}
  .status .sig span:nth-child(3){height:15px;opacity:.8}
  .status .sig span:nth-child(4){height:19px}

  /* 主体 */
  .body{display:flex;gap:26px;flex:1;min-height:0}

  /* 左侧分类（可滚动，避免矮屏被裁切） */
  .side{width:clamp(168px,17vw,230px);display:flex;flex-direction:column;gap:9px;
    overflow-y:auto;flex-shrink:0}
  .cat{padding:13px 16px;border-radius:14px;background:var(--card);color:var(--dim);
    font-size:17px;font-weight:600;display:flex;align-items:center;gap:12px;cursor:pointer;
    border:2px solid transparent;transition:.15s;flex-shrink:0}
  .cat .ic{font-size:21px}
  .cat .cnt{margin-left:auto;color:var(--dim);font-size:13px;font-weight:500}
  .cat.active{background:linear-gradient(90deg,var(--acc),#ff6b50);color:#fff;border-color:transparent;
    box-shadow:0 8px 22px rgba(255,59,65,.35)}
  .cat.active .cnt{color:rgba(255,255,255,.85)}
  .cat.focus{outline:none;border-color:var(--gold);transform:scale(1.03)}

  /* 右侧内容 */
  .content{flex:1;display:flex;flex-direction:column;gap:20px;min-width:0}

  /* Hero 正在播放 */
  .hero{display:flex;gap:22px;background:var(--card);border-radius:20px;padding:22px;
    border:1px solid var(--line);position:relative;overflow:hidden;flex-shrink:0}
  .hero .poster{flex:0 0 clamp(200px,26vw,320px);height:clamp(120px,22vh,180px);border-radius:14px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1b2742,#0c1322)}
  .hero .poster .big{font-size:60px;font-weight:800;color:#fff;opacity:.92;text-shadow:0 4px 20px rgba(0,0,0,.5)}
  .hero .poster .play{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-size:26px;backdrop-filter:blur(4px)}
  .hero .poster .tag{position:absolute;top:10px;left:10px;background:var(--acc);color:#fff;
    font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px}
  .hero .meta{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}
  .hero .meta .name{font-size:34px;font-weight:800}
  .hero .meta .sub{color:var(--dim);font-size:16px}
  .hero .meta .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .pill{background:var(--card2);border:1px solid var(--line);color:var(--txt);font-size:13px;
    padding:6px 12px;border-radius:20px}
  .pill.hd{color:var(--gold);border-color:rgba(255,210,77,.4)}
  .pill.ok{color:var(--ok);border-color:rgba(34,211,166,.4)}

  /* 频道网格 */
  .grid-title{font-size:18px;font-weight:700;color:var(--dim);margin:2px 0 -4px;flex-shrink:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:14px;
    overflow:auto;padding:4px 2px 8px;align-content:start}
  /* 省份分区标题（跨整行） */
  .prov-head{grid-column:1/-1;color:var(--gold);font-size:15px;font-weight:700;
    padding:14px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:2px}
  .prov-head .pn{color:var(--txt)}
  .prov-head .pc{color:var(--dim);font-weight:500;font-size:13px;margin-left:8px}
  .ch{background:var(--card);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;
    align-items:center;gap:10px;cursor:pointer;border:2px solid transparent;transition:.12s;min-height:108px;justify-content:center}
  .ch .logo{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:800;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .ch .nm{font-size:14px;font-weight:600;text-align:center;line-height:1.25}
  .ch.focus{outline:none;border-color:var(--gold);transform:translateY(-4px) scale(1.04);
    background:var(--card2);box-shadow:0 14px 30px rgba(0,0,0,.45)}
  .ch.playing .logo{box-shadow:0 0 0 3px var(--ok),0 6px 16px rgba(0,0,0,.35)}

  /* 底部 EPG 条 */
  .epg{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:14px;
    padding:14px 20px;border:1px solid var(--line);flex-shrink:0}
  .epg .lab{color:var(--acc);font-weight:700;font-size:14px;white-space:nowrap}
  .epg .now{font-weight:700;font-size:16px}
  .epg .next{color:var(--dim);font-size:15px}
  .epg .next b{color:var(--txt)}
  .epg .bar{flex:1;height:6px;background:var(--card2);border-radius:4px;position:relative;overflow:hidden}
  .epg .bar i{position:absolute;left:0;top:0;bottom:0;width:38%;background:var(--acc);border-radius:4px}

  .hint{position:fixed;bottom:18px;right:34px;color:var(--dim);font-size:13px;background:rgba(0,0,0,.35);
    padding:8px 14px;border-radius:10px}
  .hint b{color:var(--gold)}

  /* 手机横屏（矮高度）时压缩间距，避免溢出 */
  @media (max-height:480px){
    .screen{padding:14px 18px 10px}
    .topbar{margin-bottom:12px}
    .body{gap:16px}
    .hero{padding:14px;gap:14px}
    .hero .meta .name{font-size:26px}
    .ch{min-height:84px;padding:10px 8px}
    .ch .logo{width:46px;height:46px;font-size:15px}
    .grid{gap:10px}
    .prov-head{padding:9px 4px 4px}
  }
</style>
</head>

let catIdx=0, chIdx=0, zone="cat"; // zone: cat | ch

const side=document.getElementById("side");
const grid=document.getElementById("grid");
const gridTitle=document.getElementById("gridTitle");
const heroName=document.getElementById("heroName");

// ====== 渲染：左侧分类 ======
function renderCats(){
  side.innerHTML="";
  GROUPS.forEach((g,i)=>{
    const d=document.createElement("div");
    d.className="cat"+(i===catIdx?" active":"")+(zone==="cat"&&i===catIdx?" focus":"");
    d.innerHTML=`<span class="ic">${g.ic}</span>${g.name}<span class="cnt">${g.ch.length}</span>`;
    d.onclick=()=>{catIdx=i;selectCat();};
    side.appendChild(d);
  });
  const act=side.children[catIdx]; if(act)act.scrollIntoView({block:"nearest"});
}

function curChannels(){ return GROUPS[catIdx].ch; }

// ====== 渲染：频道网格（地方台按省份分区） ======
function renderGrid(){
  const g=GROUPS[catIdx], list=curChannels();
  const provCount=g.byProv ? new Set(list.map(c=>c.p)).size : 0;
  gridTitle.textContent=g.name+" · 共 "+list.length+" 个频道"
    +(g.byProv ? " · 覆盖全部 "+provCount+" 个省级行政区" : "");
  grid.innerHTML="";
  if(!list.length){grid.innerHTML='<div style="color:var(--dim);padding:20px">暂无频道</div>';return;}
  if(chIdx>=list.length)chIdx=list.length-1;
  if(chIdx<0)chIdx=0;

  let lastProv=null;
  list.forEach((c,i)=>{
    if(g.byProv && c.p!==lastProv){
      const cnt=list.filter(x=>x.p===c.p).length;
      const h=document.createElement("div");
      h.className="prov-head";
      h.innerHTML=`<span class="pn">${c.r} · ${c.p}</span><span class="pc">${cnt} 个频道</span>`;
      grid.appendChild(h);
      lastProv=c.p;
    }
    const d=document.createElement("div");
    d.className="ch"+(zone==="ch"&&i===chIdx?" focus":"")+(c.n===heroName.textContent?" playing":"");
    d.innerHTML=`<div class="logo" style="background:linear-gradient(135deg,${c.c},${shade(c.c)})">${c.s}</div><div class="nm">${c.n}</div>`;
    d.onclick=()=>{chIdx=i;play(c);};
    grid.appendChild(d);
  });
  const items=grid.querySelectorAll(".ch");
  const cur=items[chIdx]; if(cur)cur.scrollIntoView({block:"nearest"});
}

function shade(hex){
  const n=parseInt(hex.replace("#",""),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,r-50);g=Math.max(0,g-50);b=Math.max(0,b-50);
  return `rgb(${r},${g},${b})`;
}

function play(c){
  heroName.textContent=c.n;
  document.getElementById("heroBig").textContent=(c.s||"TV").slice(0,2);
  document.getElementById("heroSub").textContent=(c.p?c.p+" · ":"")+GROUPS[catIdx].name+" · 高清直播";
  document.getElementById("heroCat").textContent=c.p||GROUPS[catIdx].name;
  document.getElementById("epgNow").textContent=sample(c.n);
  document.getElementById("epgNext").textContent=sample2(c.n);
  renderGrid();
}
function sample(n){const a=["新闻联播","黄金剧场","综艺大观","体育赛事","焦点访谈","经典纪录片","电视剧场"];return a[n.length%a.length];}
function sample2(n){const a=["天气预报","晚间新闻","电视剧续集","访谈节目","动漫世界","美食栏目"];return a[(n.length+1)%a.length];}

function selectCat(){zone="cat";chIdx=0;renderCats();renderGrid();}
function selectCh(){zone="ch";renderCats();renderGrid();}

// 左右键跨省跳转（仅在按省份分区的分类里生效）
function jumpProv(dir){
  const list=curChannels();
  const marks=[];
  list.forEach((c,i)=>{ if(i===0||c.p!==list[i-1].p) marks.push({p:c.p,idx:i}); });
  const cur=list[chIdx].p;
  const pos=marks.findIndex(m=>m.p===cur);
  chIdx=marks[(pos+dir+marks.length)%marks.length].idx;
  renderGrid();
}

// ====== 键盘 / 遥控交互 ======
document.addEventListener("keydown",e=>{
  const list=curChannels(), byProv=GROUPS[catIdx].byProv;
  if(e.key==="ArrowUp"){
    if(zone==="cat"){catIdx=(catIdx-1+GROUPS.length)%GROUPS.length;renderCats();renderGrid();}
    else if(zone==="ch"){chIdx=Math.max(0,chIdx-1);renderGrid();}
  }else if(e.key==="ArrowDown"){
    if(zone==="cat"){catIdx=(catIdx+1)%GROUPS.length;renderCats();renderGrid();}
    else if(zone==="ch"){chIdx=Math.min(list.length-1,chIdx+1);renderGrid();}
  }else if(e.key==="ArrowLeft"){
    if(zone==="cat"){catIdx=(catIdx-1+GROUPS.length)%GROUPS.length;renderCats();renderGrid();}
    else if(zone==="ch"&&byProv){jumpProv(-1);}
  }else if(e.key==="ArrowRight"){
    if(zone==="cat"){selectCh();}
    else if(zone==="ch"&&byProv){jumpProv(1);}
    else if(zone==="ch"){chIdx=Math.min(list.length-1,chIdx+1);renderGrid();}
  }else if(e.key==="Enter"){
    if(zone==="cat")selectCh();
    else play(list[chIdx]);
  }else if(e.key==="Escape"){selectCat();}
});

// ====== 时钟 ======
function tick(){
  const d=new Date();
  const p=x=>String(x).padStart(2,"0");
  document.getElementById("clock").textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  document.getElementById("date").textContent=`${d.getMonth()+1}月${d.getDate()}日 周${"日一二三四五六"[d.getDay()]}`;
}
setInterval(tick,1000);tick();

// ====== 初始化 ======
renderCats();
play(GROUPS[0].ch[0]);

</script>
